<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подписки • Панель</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fb;
      --card-bg: rgba(255, 255, 255, 0.8);
      --text: #1e293b;
      --muted: #64748b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #f59e0b;
      --success: #10b981;
      --radius: 20px;
      --shadow: 0 20px 40px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.04);
      --input-bg: rgba(255,255,255,0.9);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f5f7fb 0%, #eef1f8 100%);
      min-height: 100vh;
      padding: 20px;
      color: var(--text);
    }
    header {
      max-width: 100%;
      margin: 0 auto 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    h1 {
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .user-badge {
      background: rgba(255,255,255,0.9);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .btn-logout {
      padding: 8px 16px;
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 10px;
      background: white;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      max-width: 100%;
      margin: 0 auto 20px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      align-items: end;
    }
    .input-group input, .input-group select {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.9rem;
      background: var(--input-bg);
      border: 1.5px solid rgba(0,0,0,0.06);
      border-radius: 12px;
      outline: none;
    }
    .input-group input:focus, .input-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .input-group label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
    }
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 36px; }
    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1em;
    }
    .btn-add, .btn-save {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-cancel {
      background: white;
      color: var(--text);
      border: 1px solid rgba(0,0,0,0.05);
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    
    /* ТАБЛИЦА БЕЗ СКРОЛЛА */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }
    .subscription-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 600px;
    }
    .subscription-table th {
      padding: 10px 8px;
      font-weight: 500;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border-bottom: 2px solid rgba(0,0,0,0.05);
      white-space: nowrap;
    }
    .subscription-table td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(0,0,0,0.03);
      white-space: nowrap;
    }
    .subscription-table a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .action-btns {
      display: flex;
      gap: 4px;
    }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 6px;
      border-radius: 6px;
    }
    .btn-edit { color: var(--primary); }
    .btn-delete { color: var(--danger); }
    .btn-router { color: var(--success); }
    .empty-message {
      text-align: center;
      color: var(--muted);
      padding: 30px;
    }
    .created-by {
      font-size: 0.75rem;
      color: var(--muted);
    }
    
    /* Модальные окна */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      max-width: 95vw;
      width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    @media (max-width: 600px) {
      body { padding: 10px; }
      h1 { font-size: 1.3rem; }
      .form-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .card { padding: 15px; }
      .subscription-table { font-size: 0.78rem; }
      .subscription-table th, .subscription-table td { padding: 8px 4px; }
      .modal { width: 95vw; padding: 15px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📋 Мои подписки</h1>
    <div class="user-info">
      <div class="user-badge">
        <span>👤</span>
        <span id="userEmail"></span>
      </div>
      <button class="btn-logout" id="logoutBtn">Выйти</button>
    </div>
  </header>

  <div class="card" id="formCard">
    <h3 id="formTitle" style="margin-bottom: 18px;">Добавить новую подписку</h3>
    <div class="form-grid">
      <div class="input-group">
        <label>Адрес</label>
        <input type="text" id="address" placeholder="ул. Ленина, 10">
      </div>
      <div class="input-group">
        <label>Дата подключения</label>
        <input type="date" id="connectionDate">
      </div>
      <div class="input-group">
        <label>ID оборудования</label>
        <input type="text" id="equipmentId" placeholder="EQ-001">
      </div>
      <div class="input-group">
        <label>Срок подписки</label>
        <select id="duration">
          <option value="1">1 месяц</option>
          <option value="3">3 месяца</option>
          <option value="6">6 месяцев</option>
          <option value="12">12 месяцев</option>
        </select>
      </div>
      <div class="input-group">
        <label>Доменное имя (KeenDNS)</label>
        <input type="text" id="domainName" placeholder="client.keenetic.pro">
      </div>
      <div class="input-group">
        <label>Стоимость (₽)</label>
        <input type="number" id="cost" placeholder="1500" step="0.01">
      </div>
      <div class="input-group">
        <label>Логин роутера</label>
        <input type="text" id="routerUsername" placeholder="admin">
      </div>
      <div class="input-group">
        <label>Пароль роутера</label>
        <div class="password-wrapper">
          <input type="password" id="routerPassword" placeholder="••••••••">
          <button type="button" class="toggle-password" id="togglePassword">👁️</button>
        </div>
      </div>
      <button class="btn-add" id="addBtn">➕ Добавить</button>
      <button class="btn-save" id="saveBtn" style="display: none;">💾 Сохранить</button>
      <button class="btn-cancel" id="cancelBtn" style="display: none;">✖ Отмена</button>
    </div>
  </div>

  <div class="card" style="overflow-x: auto;">
    <table class="subscription-table">
      <thead>
        <tr>
          <th>Адрес</th>
          <th>Дата подкл.</th>
          <th>ID обор.</th>
          <th>Срок (мес)</th>
          <th>Домен</th>
          <th>Стоимость</th>
          <th>Окончание</th>
          <th>Роутер</th>
          <th>Кто добавил</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="10" class="empty-message">Нет добавленных подписок</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Модальное окно для удаления -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>Удалить подписку?</h3>
      <p id="deleteMessage">Вы уверены, что хотите удалить эту запись?</p>
      <div class="modal-btns">
        <button class="btn-cancel" id="cancelDeleteBtn">Отмена</button>
        <button class="btn-add" id="confirmDeleteBtn" style="background: var(--danger); box-shadow: 0 8px 20px rgba(239,68,68,0.3);">Удалить</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно для данных роутера -->
  <div class="modal-overlay" id="routerModal">
    <div class="modal">
      <h3>📡 Данные с роутера</h3>
      <div id="routerContent">
        <p>Загрузка...</p>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" id="closeRouterModal">Закрыть</button>
      </div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
